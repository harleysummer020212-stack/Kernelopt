name: Build KernelOpt.exe

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone ImGui
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git _imgui_tmp
          mkdir src\imgui
          copy _imgui_tmp\imgui.h             src\imgui\
          copy _imgui_tmp\imgui.cpp           src\imgui\
          copy _imgui_tmp\imgui_internal.h    src\imgui\
          copy _imgui_tmp\imconfig.h          src\imgui\
          copy _imgui_tmp\imgui_draw.cpp      src\imgui\
          copy _imgui_tmp\imgui_tables.cpp    src\imgui\
          copy _imgui_tmp\imgui_widgets.cpp   src\imgui\
          copy _imgui_tmp\backends\imgui_impl_win32.h    src\imgui\
          copy _imgui_tmp\backends\imgui_impl_win32.cpp  src\imgui\
          copy _imgui_tmp\backends\imgui_impl_dx11.h     src\imgui\
          copy _imgui_tmp\backends\imgui_impl_dx11.cpp   src\imgui\

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KernelOpt
          path: build\Release\KernelOpt.exe
